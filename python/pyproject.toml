[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quantforge"
dynamic = ["version"]
description = "MLIR-based generator of INT4 / INT8 / FP8 weight-only GEMM kernels for LLM inference, with PyTorch integration (quantize_model, GPTQ, AWQ / GPTQ checkpoint loading)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0 WITH LLVM-exception" }
authors = [{ name = "Hieu475" }]
keywords = ["quantization", "gptq", "awq", "mlir", "cuda", "llm", "int4", "fp8", "vllm", "w4a8"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Environment :: GPU :: NVIDIA CUDA",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The kernels are generated by the C++ tool `quantforge-opt` (build it with CMake, see the README) and run
# through PyTorch. Without that tool, a kernel pack (`quantforge-pack build`, or a ready-made one in QUANTFORGE_PACK) supplies them.
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
hf = ["transformers>=4.40", "safetensors", "pandas", "pyarrow"]
test = ["pytest", "lit", "psutil"]

[project.entry-points."vllm.general_plugins"]
quantforge = "quantforge.vllm_plugin:register"

[project.scripts]
quantforge-doctor = "quantforge.doctor:main"
quantforge-pack = "quantforge.pack:main"

[project.urls]
Source = "https://github.com/Hieu475/QuantForge"
Changelog = "https://github.com/Hieu475/QuantForge/blob/main/CHANGELOG.md"
Issues = "https://github.com/Hieu475/QuantForge/issues"
Blog = "https://hieu475.github.io/"

[tool.setuptools]
packages = ["quantforge", "quantforge.runtime"]

[tool.setuptools.dynamic]
version = { attr = "quantforge.__version__" }

[tool.setuptools.package-data]
"quantforge" = ["PIPELINE.md", "kernel_pack/kernels/*.so", "kernel_pack/ext/*/*.so", "kernel_pack/*.json"]
"quantforge.runtime" = ["*.c", "*.cpp", "*.cu"]
