name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"   # nightly: GPU job also runs the benchmark regression check

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_VERSION: 18

jobs:
  # ---------------------------------------------------------------------------
  # CPU only: build quantforge-opt against the apt LLVM/MLIR 18 and run every
  # FileCheck test (passes, pipeline structure, PTX text assertions).
  # ---------------------------------------------------------------------------
  build-and-lit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build python3-venv \
            llvm-${LLVM_VERSION}-dev libmlir-${LLVM_VERSION}-dev mlir-${LLVM_VERSION}-tools

      - name: Install lit
        run: |
          python3 -m venv .venv
          .venv/bin/pip install lit

      - name: Configure
        run: PATH="$PWD/.venv/bin:$PATH" cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      - name: Test (lit)
        run: PATH="$PWD/.venv/bin:$PATH" cmake --build build-ci --target check-quantforge

  # ---------------------------------------------------------------------------
  # CPU only: the Python package builds (sdist + wheel), the metadata passes twine, the wheel installs into a clean environment and its command line tools and
  # kernel-pack helpers import and run (no GPU needed for that).
  # ---------------------------------------------------------------------------
  python-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --outdir dist python
          python -m twine check dist/*
      - name: Install the wheel and run the CLIs
        run: |
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/pip install torch --index-url https://download.pytorch.org/whl/cpu
          /tmp/wheelenv/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheelenv/bin/python -c "import quantforge, quantforge.pack, quantforge.tile_plan, quantforge.atomic_plan; print(quantforge.__version__)"
          /tmp/wheelenv/bin/quantforge-pack --help
          /tmp/wheelenv/bin/quantforge-pack install --help

  # ---------------------------------------------------------------------------
  # Self-hosted runner with an NVIDIA GPU (labels: self-hosted, linux, gpu),
  # CUDA toolkit in /usr/local/cuda and a Python env with torch + pytest.
  # Compiles real kernels, runs them, compares with PyTorch, runs the
  # sanitizers, and (nightly) checks performance against the recorded baseline.
  # ---------------------------------------------------------------------------
  gpu:
    runs-on: [self-hosted, linux, gpu]
    needs: build-and-lit
    # A self-hosted runner executes whatever a pull request contains: never run it for code from a fork
    # (this repository is public). Pushes, the nightly schedule, manual runs and PRs from this repo's own branches are fine.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 120
    env:
      QUANTFORGE_BUILD_DIR: ${{ github.workspace }}/build
    steps:
      - uses: actions/checkout@v4

      - name: Preflight (toolchain, CUDA, torch, memory)
        run: scripts/ci_gpu_preflight.sh

      - name: Build
        run: |
          cmake --preset default
          # ~0.6 GiB per compile job: an unbounded ninja run once exhausted the RAM of a 15 GiB runner
          cmake --build --preset default --parallel "${QUANTFORGE_BUILD_JOBS:-6}"

      - name: GPU end-to-end tests
        run: python3 -m pytest -v

      - name: compute-sanitizer (memcheck + racecheck)
        run: scripts/sanitize.sh

      - name: Performance regression check (nightly)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python3 python/quantforge/benchmark.py 1024 2048 4096 "" \
            --json bench-result.json \
            --compare benchmarks/baseline_rtx4050_sm89.json --tolerance 0.15
          python3 python/quantforge/benchmark.py --group-size 128 \
            --shape 1024x1024x1024 --shape 2048x2048x2048 --shape 4096x4096x4096 "" \
            --json bench-groupwise.json \
            --compare benchmarks/baseline_groupwise_rtx4050_sm89.json --tolerance 0.15
          # decode: --cold flushes the L2 before every call (weights read from DRAM, as in a model)
          python3 python/quantforge/benchmark.py --cold --group-size 128 \
            --shape 1x4096x4096 --shape 16x4096x4096 --shape 1x4096x11008 --shape 1x11008x4096 \
            "decode=true block-tile-n=128 warp-tile-n=16 block-tile-k=64 smem-stages=1 prefetch-distance=1" \
            --json bench-decode.json \
            --compare benchmarks/baseline_decode_rtx4050_sm89.json --tolerance 0.15

      - name: Upload benchmark result
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: bench-result
          path: |
            bench-result.json
            bench-groupwise.json
            bench-decode.json
          if-no-files-found: ignore
