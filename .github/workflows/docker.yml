name: Docker image

# Manual only. Builds the image (compiler + torch + package, optionally vLLM) on a GitHub-hosted runner; pushing to GHCR
# happens only if you start the run with push=true. There is no GPU on the hosted runner, so the image is not run here:
# check it on a machine with the NVIDIA container toolkit (docker run --rm --gpus all <image>).
on:
  workflow_dispatch:
    inputs:
      with_vllm:
        description: "Install vLLM and the quantforge plugin in the image"
        type: boolean
        default: false
      push:
        description: "Push the image to ghcr.io"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Free disk space (the image is ~27 GB uncompressed)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          df -h /
      - name: Log in to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: WITH_VLLM=${{ inputs.with_vllm && '1' || '0' }}
          push: ${{ inputs.push }}
          tags: ghcr.io/${{ github.repository_owner }}/quantforge:${{ inputs.with_vllm && 'vllm' || 'latest' }}
